# generated by dacpro-ctl
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" alsa.card_name = "~.*(hifiberry|DAC Pro|RPi DAC|pcm512).*" } ]
    actions = { update-props = {
      resample.quality = 14
      dither.method = "none"
      session.suspend-timeout-seconds = 0
      audio.format = "S32LE"
      audio.allowed-rates = "44100,48000,88200,96000,176400,192000"
      api.alsa.soft-mixer = true
    } }
  }
]
