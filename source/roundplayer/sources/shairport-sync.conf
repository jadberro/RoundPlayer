// Round Media Player - AirPlay receiver into PipeWire (via pipewire-pulse). Generated by install_sources.sh.
general = {
  name = "Living Room Player";
  output_backend = "pa";
  interpolation = "soxr";
  volume_range_db = 60;
  ignore_volume_control = "no";
};
sessioncontrol = {
  session_timeout = 20;
  allow_session_interruption = "yes";
};
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  cover_art_cache_directory = "";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};
diagnostics = { log_verbosity = 0; };
